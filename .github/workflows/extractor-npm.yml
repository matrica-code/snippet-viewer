name: extractor-npm

# Publishes @matrica-code/snippet-extractor to npm.
# The TAG is the source of truth for the version: pushing extractor-v1.2.3 sets
# package.json to 1.2.3 at publish time. The committed version is just a default
# used by manual workflow_dispatch runs.
#
# Authenticates with npm trusted publishing (OIDC): no token secret. The package's
# Trusted Publisher on npmjs.com must name this repo and this workflow file
# (extractor-npm.yml). npm attaches provenance automatically.

on:
  push:
    tags:
      - "extractor-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm exchange the GitHub OIDC token for a publish credential
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#extractor-v}"
          echo "Publishing version $tag_version (from tag $GITHUB_REF_NAME)"
          npm version "$tag_version" --no-git-tag-version --allow-same-version

      - name: Install (no scripts — consumers compile native deps on their install)
        run: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Publish
        run: npm publish --access public
