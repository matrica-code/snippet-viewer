name: extractor-npm

# Publishes @matrica-code/snippet-extractor to npm.
# Triggers on extractor version tags (e.g. extractor-v1.0.0) and manual dispatch.
# Requires an NPM_TOKEN secret (Automation token) on the repo.

on:
  push:
    tags:
      - "extractor-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Guard — tag version must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#extractor-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME ($tag_version) != package.json ($pkg_version)" >&2
            exit 1
          fi

      - name: Install (no scripts — consumers compile native deps on their install)
        run: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
