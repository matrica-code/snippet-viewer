name: "Extract Snippets"
description: "Harvest // extract-code snippets into a snippets.json (JS/TS/TSX/Java) for snippet-viewer."
author: "matrica-code"
branding:
  icon: "scissors"
  color: "purple"

inputs:
  snippet-file:
    description: "Output JSON path, relative to the repo root (e.g. docs/snippets.json)."
    required: false
    default: "snippets.json"
  paths:
    description: "Space-separated dirs/files to scan, relative to the repo root."
    required: false
    default: "."
  reset:
    description: "Start from an empty {} instead of merging into an existing file."
    required: false
    default: "true"
  image-tag:
    description: "Tag of ghcr.io/matrica-code/snippet-extractor to run. Pin to a version for reproducibility."
    required: false
    default: "latest"
  upload-artifact:
    description: "Upload the generated snippet file as a workflow artifact."
    required: false
    default: "false"
  artifact-name:
    description: "Name for the uploaded artifact (when upload-artifact is true)."
    required: false
    default: "snippets"
  artifact-retention-days:
    description: "Days to retain the uploaded artifact (when upload-artifact is true)."
    required: false
    default: "90"

outputs:
  snippet-file:
    description: "Path (repo-root relative) of the generated snippet file."
    value: ${{ inputs.snippet-file }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SNIPPET_FILE: ${{ inputs.snippet-file }}
        PATHS: ${{ inputs.paths }}
        RESET: ${{ inputs.reset }}
        IMAGE: ghcr.io/matrica-code/snippet-extractor:${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        reset_flag=""
        [ "$RESET" = "true" ] && reset_flag="--reset"
        # Map each requested path into the mounted /work root.
        work_paths=()
        for p in $PATHS; do work_paths+=("/work/$p"); done
        docker pull "$IMAGE"
        docker run --rm -v "$PWD":/work "$IMAGE" \
          $reset_flag \
          "--snippetFile=/work/$SNIPPET_FILE" \
          "${work_paths[@]}"

    - name: Upload snippet artifact
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.snippet-file }}
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: error
